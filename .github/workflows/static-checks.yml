name: StudyHub static checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/studyhub-v2-3-admin-cloud

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML assets and JavaScript
        run: node scripts/check-studyhub.mjs
      - name: Test Admin access and login visibility
        run: node scripts/test-auth.mjs

<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obnovenie hesla | StudyHub</title>
<link rel="stylesheet" href="style/main.css">
<link rel="stylesheet" href="style/responsive.css">
<link rel="stylesheet" href="style/v2.css?v=studyhub-auth-v231">
<link rel="stylesheet" href="style/v23.css?v=studyhub-auth-v231">
<link rel="stylesheet" href="style/auth.css?v=studyhub-auth-v231">
</head>
<body class="page-reset-password">
<header class="header"><div class="container header-content"><a class="logo-link" href="index.html">StudyHub</a></div></header>
<main class="studyhub-auth-main">
<section class="studyhub-auth-card" aria-labelledby="resetTitle">
<span class="badge">● Zabezpečenie účtu</span>
<h1 id="resetTitle">Nové heslo</h1>
<p class="studyhub-auth-lead">Otvoriť túto stránku môžeš z odkazu, ktorý ti prišiel od Supabase na e-mail. Nové heslo sa uloží priamo do tvojho účtu.</p>
<form id="resetPasswordForm" class="studyhub-auth-form">
<label class="studyhub-auth-field">Nové heslo
<input type="password" id="resetPassword" autocomplete="new-password" minlength="8" placeholder="Aspoň 8 znakov" required>
</label>
<label class="studyhub-auth-field">Potvrď heslo
<input type="password" id="resetPasswordConfirm" autocomplete="new-password" minlength="8" required>
</label>
<button type="submit" class="btn primary studyhub-auth-submit" id="resetPasswordSave">Uložiť nové heslo</button>
<p id="resetPasswordMessage" role="status" aria-live="polite" class="studyhub-auth-message"></p>
</form>
<div class="studyhub-auth-bottom"><a href="login.html">Späť na prihlásenie →</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script/supabase-config.js?v=studyhub-auth-v231"></script>
<script src="script/supabase-client.js?v=studyhub-auth-v231"></script>
<script src="script/main.js?v=20260608-style-script"></script>
<script src="script/v2.js?v=studyhub-auth-v231"></script>
<script src="script/v21.js?v=studyhub-auth-v231"></script>
<script src="script/auth-ui.js?v=studyhub-auth-v231"></script>
<script src="script/auth-reset.js?v=studyhub-auth-v231"></script>
</body></html>

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
